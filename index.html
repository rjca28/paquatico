<style>
/* Layout: barra de navegação fixa + folha de relatório centrada (como um documento técnico), ferramentas acima da folha */
:root {

  --chave: #1f6fd1; --chave-bg: #eaf2fc; --acao: #0c8a4e; --acao-bg: #e7f5ed; --alerta: #c2410c; --alerta-bg: #fdf0e7;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif; --body: "Barlow", "Helvetica Neue", Arial, sans-serif;

  --navy: #a9cbf2; --accent: #5ea2f3; --accent-ink: #08131e; --accent-soft: #17304b;
  --c1: #4b92ea; --c2: #f07c4c; --c3: #2cc28b; --good: #34b878; --bad: #ec6a62; --empty: #4a5a6a; --heat1: #5ea2f3; --heat2: #f08a50;
  --chave: #7db5f5; --chave-bg: #14283d; --acao: #4cc58a; --acao-bg: #122d20; --alerta: #f39a62; --alerta-bg: #35210f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b141d; --surface: #122030; --ink: #e6edf3; --ink2: #9aa8b5; --line: #24384b; --zebra: #16283a; --hl: #3a2a12;
  --navy: #a9cbf2; --accent: #5ea2f3; --accent-ink: #08131e; --accent-soft: #17304b;
  --c1: #4b92ea; --c2: #f07c4c; --c3: #2cc28b; --good: #34b878; --bad: #ec6a62; --empty: #4a5a6a; --heat1: #5ea2f3; --heat2: #f08a50;
  --chave: #7db5f5; --chave-bg: #14283d; --acao: #4cc58a; --acao-bg: #122d20; --alerta: #f39a62; --alerta-bg: #35210f; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--navy); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { background: #16324f; color: #fff; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
header.top .wrap { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .ball { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe066, #f2b400 70%); box-shadow: inset -3px -3px 0 rgba(0,0,0,.15); flex: none; position: relative; }
.brand .ball::after { content: ""; position: absolute; inset: 4px 13px; border-left: 2px solid #c78f00; border-right: 2px solid #c78f00; border-radius: 50%; }
.brand h1 { font-family: var(--display); font-size: 23px; letter-spacing: .3px; margin: 0; line-height: 1.05; text-wrap: balance; }
.brand small { display: block; font-size: 11.5px; letter-spacing: 1.2px; text-transform: uppercase; opacity: .75; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav.tabs button { white-space: nowrap; flex: none; font: 600 14px var(--body); color: #cfe0f3; background: transparent; border: 0; padding: 7px 12px; border-radius: 8px; cursor: pointer; }
nav.tabs button[aria-current="page"] { background: #ffffff; color: #16324f; }
nav.tabs button:hover:not([aria-current="page"]) { background: rgba(255,255,255,.1); color: #fff; }
nav.tabs .count { font-size: 12px; background: rgba(255,255,255,.18); border-radius: 10px; padding: 0 6px; margin-left: 4px; }
nav.tabs button[aria-current="page"] .count { background: #e6effb; }
button:focus-visible, select:focus-visible, input:focus-visible, label.drop:focus-within { outline: 3px solid #f2b400; outline-offset: 2px; }
main { padding-block: 20px 60px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 16px; }
.toolbar .field { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 180px; }
.toolbar .field.wide { flex: 3 1 320px; }
label.lab, .field > span { font-size: 11.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--ink2); }
select, input[type=text], input[type=date] { font: 500 14.5px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0; }
.exports { display: flex; gap: 6px; flex-wrap: wrap; }
.btn { font: 700 14px var(--body); border-radius: 8px; padding: 8px 13px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn[disabled] { opacity: .55; cursor: progress; }
.ftag { font: 700 10.5px var(--body); padding: 1px 5px; border-radius: 4px; color: #fff; letter-spacing: .4px; }
.ftag.x { background: #1d7a46 } .ftag.w { background: #2b5797 } .ftag.p { background: #c4302b }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px clamp(16px, 4vw, 40px) 36px; }
.cover .eyebrow { font-size: 11.5px; letter-spacing: 1.4px; font-weight: 700; color: var(--ink2); }
.cover h2 { font-family: var(--display); font-size: clamp(30px, 5vw, 44px); line-height: 1.05; margin: 4px 0 4px; color: var(--navy); text-wrap: balance; }
.cover .sub { color: var(--ink2); padding-bottom: 12px; border-bottom: 3px solid var(--accent); margin-bottom: 18px; }
.sheet h3.h1 { font-family: var(--display); font-size: 26px; color: var(--navy); margin: 34px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); text-wrap: balance; }
.sheet h4.h2 { font-size: 17px; color: var(--accent); margin: 20px 0 8px; }
.sheet p { margin: 0 0 10px; max-width: 72ch; }
.tw { overflow-x: auto; margin: 4px 0 6px; }
table.t { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.t th { background: #16324f; color: #fff; font-weight: 700; padding: 6px 8px; text-align: center; white-space: nowrap; }
table.t td { padding: 5px 8px; text-align: center; border-bottom: 1px solid var(--line); }
table.t td:first-child, table.t th:first-child { text-align: left; font-weight: 700; }
table.t tr:nth-child(even) td { background: var(--zebra); }
table.t tr.hl td { background: var(--hl); }
table.t tr.last td { font-weight: 700; }
table.t.compare td:not(:first-child) { font-size: 14.5px; }
.cap { font-size: 12.5px; color: var(--ink2); font-style: italic; text-align: center; margin: 2px 0 16px; }
figure.ch { margin: 8px auto 4px; text-align: center; }
figure.ch canvas { display: block; margin: 0 auto; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 6px 0 16px; }
.kpi { background: var(--zebra); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.kpi b { display: block; font-family: var(--display); font-size: 30px; line-height: 1; color: var(--navy); font-variant-numeric: tabular-nums; }
.kpi.good b { color: var(--good) } .kpi.warn b { color: var(--alerta) }
.kpi span { display: block; font-weight: 700; font-size: 13px; margin-top: 4px; }
.kpi small { color: var(--ink2); font-size: 12px; }
.box { border-left: 5px solid; border-radius: 0 8px 8px 0; padding: 10px 16px 8px; margin: 10px 0 14px; }
.box .lbl { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; margin-bottom: 4px; }
.box ul { margin: 0; padding-left: 18px; } .box li { margin-bottom: 5px; }
.box.chave { border-color: var(--chave); background: var(--chave-bg) } .box.chave .lbl { color: var(--chave) }
.box.acao { border-color: var(--acao); background: var(--acao-bg) } .box.acao .lbl { color: var(--acao) }
.box.alerta { border-color: var(--alerta); background: var(--alerta-bg) } .box.alerta .lbl { color: var(--alerta) }
.ficha { border: 1px solid var(--line); border-radius: var(--r); margin: 14px 0; overflow: hidden; }
.ficha .fh { background: #16324f; color: #fff; padding: 8px 14px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.ficha .fh b { font-family: var(--display); font-size: 22px; }
.ficha .kpis { margin: 10px 12px; }
.ficha .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 0 14px 6px; }
.ficha .cols > div { border-top: 3px solid; padding-top: 6px; min-width: 0; }
.ficha .cols h5 { margin: 0 0 4px; font-size: 12px; letter-spacing: 1px; }
.ficha .cols ul { margin: 0; padding-left: 16px; font-size: 14px; } .ficha .cols li { margin-bottom: 4px; }
.ficha .c1 { border-color: var(--good) } .ficha .c1 h5 { color: var(--good) }
.ficha .c2 { border-color: var(--alerta) } .ficha .c2 h5 { color: var(--alerta) }
.ficha .c3 { border-color: var(--accent) } .ficha .c3 h5 { color: var(--accent) }
.ficha .extra { font-size: 13px; color: var(--ink2); padding: 4px 14px 12px; }
ul.notes { font-size: 13px; color: var(--ink2); padding-left: 18px; }
.empty { text-align: center; padding: 50px 20px; color: var(--ink2); }
.empty h2 { font-family: var(--display); color: var(--navy); font-size: 28px; margin: 0 0 6px; }
label.drop { display: block; border: 2px dashed var(--accent); background: var(--accent-soft); border-radius: var(--r); padding: 30px 16px; text-align: center; cursor: pointer; }
label.drop.over { background: var(--surface); }
label.drop b { font-family: var(--display); font-size: 24px; color: var(--navy); display: block; }
label.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.imports { display: grid; gap: 12px; margin-top: 16px; }
.icard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; }
.icard .head { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.icard .head b { font-family: var(--display); font-size: 22px; color: var(--navy); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 20px; }
.pill.ok { background: var(--acao-bg); color: var(--acao) } .pill.warn { background: var(--alerta-bg); color: var(--alerta) } .pill.info { background: var(--chave-bg); color: var(--chave) }
.icard .grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; }
.icard .grid > div { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.icard .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.icard.err { border-color: var(--bad); }
.icard ul { margin: 0; padding-left: 18px; font-size: 13.5px; color: var(--alerta); }
.notice { font-size: 13.5px; padding: 9px 12px; border-radius: 8px; background: var(--chave-bg); color: var(--ink); margin-bottom: 14px; }
.notice.warn { background: var(--alerta-bg); }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #16324f; color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; box-shadow: 0 6px 24px rgba(0,0,0,.25); z-index: 20; max-width: calc(100% - 32px); }
.muted { color: var(--ink2); }

  .ficha .cols { grid-template-columns: 1fr; }
  .icard .grid { grid-template-columns: 1fr 1fr; }
  nav.tabs { margin-left: 0; width: 100%; overflow-x: auto; flex-wrap: nowrap; }
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .25s ease-out; } @keyframes rise { from { transform: translateY(6px); opacity: .6 } to { transform: none; opacity: 1 } } }

<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="ball" aria-hidden="true"></span><div><h1>Atas de Pólo Aquático</h1><small>FPN · Direção Técnica Nacional</small></div></div>
  <nav class="tabs" aria-label="Secções">
    <button id="tab-jogo" data-view="jogo">Relatório do jogo</button>
    <button id="tab-global" data-view="global">Análise global</button>
    <button id="tab-importar" data-view="importar">Importar atas</button>
    <button id="tab-atas" data-view="atas">Atas guardadas <span class="count" id="n-atas">0</span></button>
  </nav>
</div></header>

<main class="wrap">
  <div id="store-note" class="notice" hidden></div>

  <section id="v-jogo" hidden>
    <div class="toolbar">
      <div class="field wide"><span>Jogo</span><select id="sel-jogo" aria-label="Jogo"></select></div>
      <div class="exports" aria-label="Exportar relatório do jogo">
        <button class="btn" data-exp="jogo-xlsx"><span class="ftag x">XLSX</span>Excel</button>
        <button class="btn" data-exp="jogo-docx"><span class="ftag w">DOCX</span>Word</button>
        <button class="btn" data-exp="jogo-pdf"><span class="ftag p">PDF</span>PDF</button>
      </div>
    </div>
    <article id="rep-jogo" class="sheet"></article>
  </section>

  <section id="v-global" hidden>
    <div class="toolbar">
      <div class="field wide"><span>Competição</span><select id="f-comp" aria-label="Competição"></select></div>
      <div class="field"><span>Género</span><select id="f-gen" aria-label="Género"><option value="">Todos</option><option>Masculino</option><option>Feminino</option></select></div>
      <div class="field"><span>Desde</span><input type="date" id="f-de" aria-label="Desde"></div>
      <div class="field"><span>Até</span><input type="date" id="f-ate" aria-label="Até"></div>
      <div class="exports" aria-label="Exportar análise global">
        <button class="btn" data-exp="global-xlsx"><span class="ftag x">XLSX</span>Excel</button>
        <button class="btn" data-exp="global-docx"><span class="ftag w">DOCX</span>Word</button>
        <button class="btn" data-exp="global-pdf"><span class="ftag p">PDF</span>PDF</button>
      </div>
    </div>
    <article id="rep-global" class="sheet"></article>
  </section>

  <section id="v-importar" hidden>
    <label class="drop" id="drop" for="file-in">
      <b>Largue aqui as atas em PDF</b>
      <span class="muted">ou toque para escolher ficheiros · pode juntar várias atas de uma vez</span>
      <input type="file" id="file-in" accept="application/pdf,.pdf" multiple>
    </label>
    <div class="imports" id="imports"></div>
  </section>

  <section id="v-atas" hidden>
    <div class="sheet" style="padding-top:20px">
      <h3 class="h1" style="border:0;margin-top:0;padding-top:0">Atas guardadas</h3>
      <p class="muted" id="atas-sub"></p>
      <div class="exports" style="margin-bottom:12px"><button class="btn" data-backup="1">Exportar cópia (JSON)</button><label class="btn" for="restore-in" style="cursor:pointer">Importar cópia<input type="file" id="restore-in" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0"></label></div>
      <div class="tw"><table class="t" id="atas-table"></table></div>
    </div>
  </section>
</main>
<div id="toast" role="status" hidden></div>

function parseAta(pages) {

      const name = (m.length > 3 && /^\d{3,8}$/.test(m[1]) ? m[3] : m[2]).trim();

  if (!dev) throw new Error("Não encontrei a secção «DESENVOLVIMENTO» da ata.");
  const tempos = items.filter(i => i.s === "Tempo" && i.y < dev.y + 1);
  const headerRows = [...new Set(tempos.map(t => Math.round(t.y)))].sort((a, b) => b - a);
  const stopY = (find("TIME OUT") || find("RESULTADOS") || { y: -1e9 }).y;
  const events = [], extra = [], checks = [];
  headerRows.forEach((hy, ri) => {
    const row = tempos.filter(t => near(t.y, hy, 2)).sort((a, b) => a.x - b.x);
    const lowY = ri + 1 < headerRows.length ? headerRows[ri + 1] + 8 : stopY;
    row.forEach((t, ci) => {
      const x0 = t.x - 6, x1 = ci + 1 < row.length ? row[ci + 1].x - 6 : 1e9;
      const per = items.filter(i => /^Per[ií]odo\s*\d+/.test(i.s) && i.y > hy && i.y < hy + 20 && i.x >= x0 - 10 && i.x < x1).map(i => +i.s.match(/\d+/)[0])[0] || (ri * row.length + ci + 1);
      const labs = {}; items.filter(i => near(i.y, hy, 2) && i.x >= x0 && i.x < x1).forEach(i => { labs[i.s] = i.x; });
      const col = { t: labs["Tempo"], team: labs["B/A"], n: labs["Nº"], c: labs["Cód."], g: labs["Golos"] };
      const cell = items.filter(i => i.y < hy - 2 && i.y > lowY && i.x >= x0 && i.x < x1);
      const ys = [...new Set(cell.filter(i => /^\d\d:\d\d$/.test(i.s)).map(i => i.y))].sort((a, b) => b - a);
      ys.forEach(y => {
        const r = cell.filter(i => near(i.y, y, 2)).sort((a, b) => a.x - b.x);

        r.forEach(i => {
          if (/^\d\d:\d\d$/.test(i.s) && !ev.t) { ev.t = i.s; return; }
          const keys = Object.keys(col).filter(k => col[k] != null && k !== "t");
          const k = keys.sort((a, b) => Math.abs(i.x - col[a]) - Math.abs(i.x - col[b]))[0];
          if (k === "g" || (col.g != null && i.x > col.g - 4)) { (i.s.match(/\d+/g) || []).forEach(d => ev.g.push(+d)); return; }
          if (k === "team") ev.team = i.s; else if (k === "n") ev.n = /^\d+$/.test(i.s) ? +i.s : ev.n; else if (k === "c") ev.c = /^\d+$/.test(i.s) ? +i.s : ev.c;
        });
        if (ev.c == null) { warn.push(`Linha sem código no ${per}.º período (${ev.t}).`); return; }
        if (ev.team && ev.team !== local && ev.team !== visit) warn.push(`Equipa desconhecida «${ev.team}» no ${per}.º período (${ev.t}).`);
        const rec = [ev.p, ev.t, ev.team || null, ev.n, ev.c];
        if (ev.g.length >= 2) checks.push({ p: ev.p, t: ev.t, sc: [ev.g[0], ev.g[1]] });

    });
  });
  if (!events.length) throw new Error("Não encontrei eventos no desenvolvimento do jogo.");
  return { meta, rosters, coaches, events, extra, checks, warnings: warn };
}

/* ===== Motor de análise ===== */
const GOALC = { 1: "acao", 2: "sup", 3: "pen" };

function analyseGame(g) {

  const T = {}; teams.forEach(tm => T[tm] = { team: tm, opp: opp[tm], golos: 0, acao: 0, sup: 0, pen: 0, nSup: 0, supConv: 0, inf: 0, infSof: 0, golInf: 0, excl: 0, penGanhos: 0, penCom: 0, penFalh: 0, sprints: 0, sprintGolo: 0, timeouts: 0, amarelos: 0, ult2: 0, gp: [0, 0, 0, 0], exclP: [0, 0, 0, 0], blocks: [0, 0, 0, 0], supByP: [[0, 0], [0, 0], [0, 0], [0, 0]], supState: { perder: [0, 0], empate: [0, 0], ganhar: [0, 0] }, ult4: [0, 0] });
  const P = {}; const pl = (tm, n) => { const k = tm + "|" + n; return P[k] || (P[k] = { team: tm, n, name: name(tm, n), golos: 0, acao: 0, sup: 0, pen: 0, excl: 0, penCom: 0, penFalh: 0, faltas: [], game: g.id }); };

    }
    if (isExcl(e.c) && t) { t.excl++; if (e.p <= 4) t.exclP[e.p - 1]++; const p = pl(tm, e.n); p.excl++; p.faltas.push(`${e.p}P ${e.t.replace(/^0/, "")} ${e.c === 4 ? "E" : "(s/ letra)"}`); }
    if (e.c === 5 && t) { t.penCom++; T[opp[tm]].penGanhos++; const p = pl(tm, e.n); p.penCom++; p.faltas.push(`${e.p}P ${e.t.replace(/^0/, "")} P`); }

    if (e.c === 15 && t) { t.sprints++; if (goals.some(x => x.team === tm && x.s >= e.s && x.s - e.s <= 35)) t.sprintGolo++; }
    if (e.c === 8 && t) t.timeouts++;

  });

    if (gg) { s.scorer = gg.n; s.scorerName = name(s.adv, gg.n); s.secs = gg.s - s.start; }
    const b = scoreAt(s.start); const d = b[s.adv] - b[s.inf]; s.state = d > 0 ? "ganhar" : d < 0 ? "perder" : "empate"; s.score = `${b[A]}-${b[B]}`;
    const t = T[s.adv]; t.nSup++; if (s.p <= 4) { t.supByP[s.p - 1][0]++; if (s.conv) t.supByP[s.p - 1][1]++; } t.supState[s.state][0]++; if (s.conv) { t.supConv++; t.supState[s.state][1]++; }
    const o = T[s.inf]; o.inf++; if (s.conv) o.infSof++; if (s.golInf) o.golInf++;

  });
  // métricas por equipa
  teams.forEach(tm => {
    const t = T[tm], gi = tm === A ? 0 : 1;
    const ts = [0, ...goals.filter(x => x.team === tm).map(x => x.s), 4 * L];
    let best = [0, 0, 0]; for (let i = 0; i < ts.length - 1; i++) { const d = ts[i + 1] - ts[i]; if (d > best[0]) best = [d, ts[i], ts[i + 1]]; }
    const fmt = s => { if (s >= 4 * L) return "fim"; if (s === 0) return "início"; const p = Math.floor(s / L) + 1, r = L - s % L; return `${p}P ${mmss(r)}`; };
    t.seca = best[0]; t.secaTxt = `${fmt(best[1])} → ${fmt(best[2])}`;
    const conc = goals.map((x, i) => [x, i]).filter(([x]) => x.team === opp[tm]);
    t.sofComSeg = conc.filter(([, i]) => i + 1 < goals.length).length; t.respostas = conc.filter(([, i]) => i + 1 < goals.length && goals[i + 1].team === tm).length;
    t.ult4 = [goals.filter(x => x.team === tm && x.s >= 3 * L + L / 2).length, goals.filter(x => x.team === opp[tm] && x.s >= 3 * L + L / 2).length];
    const parc = [1, 2, 3, 4].map(p => [goals.filter(x => x.p === p && x.team === A).length, goals.filter(x => x.p === p && x.team === B).length]);
    t.perWon = parc.filter(p => p[gi] > p[1 - gi]).length; t.perDraw = parc.filter(p => p[gi] === p[1 - gi]).length;
    const ps = Object.values(P).filter(p => p.team === tm && p.golos > 0).sort((a, b) => b.golos - a.golos);
    t.marcadores = ps.length; t.top1 = ps[0] ? ps[0].golos : 0; t.top1Nome = ps[0] ? ps[0].name : ""; t.top3 = ps.slice(0, 3).reduce((a, p) => a + p.golos, 0);

  });

/* ===== Agregação ===== */
const SUMK = ["golos", "acao", "sup", "pen", "nSup", "supConv", "inf", "infSof", "golInf", "excl", "penGanhos", "penCom", "penFalh", "sprints", "sprintGolo", "timeouts", "amarelos", "ult2", "seca0", "sofComSeg", "respostas", "gm", "gs", "jogos", "perWon", "perDraw", "fora", "toSup", "toSupConv"];
function teamKey(an, tm) { return tm + "|" + (an.meta.genero || ""); }
function aggregate(list) {
  const teams = {}, players = {}; const all = { situations: [], timeouts: [], secs: [], blocks: [0, 0, 0, 0], golos: 0 };
  const genders = {}; list.forEach(an => an.teams.forEach(tm => { (genders[tm] = genders[tm] || new Set()).add(an.meta.genero); }));
  list.forEach(an => {
    an.teams.forEach(tm => {
      const k = teamKey(an, tm), s = an.T[tm];
      const t = teams[k] || (teams[k] = { key: k, team: tm, label: genders[tm].size > 1 ? `${tm} (${(an.meta.genero || "?")[0]})` : tm, genero: an.meta.genero, V: 0, E: 0, D: 0, gp: [0, 0, 0, 0], exclP: [0, 0, 0, 0], blocks: [0, 0, 0, 0], supByP: [[0, 0], [0, 0], [0, 0], [0, 0]], supState: { perder: [0, 0], empate: [0, 0], ganhar: [0, 0] }, ult4: [0, 0], seca: 0, secaTxt: "", secs: [], jogosList: [] });
      SUMK.forEach(x => t[x] = (t[x] || 0) + (s[x] || 0));
      t[s.res]++; for (let i = 0; i < 4; i++) { t.gp[i] += s.gp[i]; t.exclP[i] += s.exclP[i]; t.blocks[i] += s.blocks[i]; t.supByP[i][0] += s.supByP[i][0]; t.supByP[i][1] += s.supByP[i][1]; }
      ["perder", "empate", "ganhar"].forEach(z => { t.supState[z][0] += s.supState[z][0]; t.supState[z][1] += s.supState[z][1]; });
      t.ult4[0] += s.ult4[0]; t.ult4[1] += s.ult4[1]; if (s.seca > t.seca) { t.seca = s.seca; t.secaTxt = `${s.secaTxt} vs ${s.opp}`; }
      t.secs.push(...s.secs); t.jogosList.push(`${an.meta.local} ${an.score[0]}–${an.score[1]} ${an.meta.visit}`);
      all.golos += s.golos; for (let i = 0; i < 4; i++) all.blocks[i] += s.blocks[i]; all.secs.push(...s.secs);
    });
    an.players.forEach(p => {
      const k = p.team + "|" + an.meta.genero + "|" + p.name;
      const q = players[k] || (players[k] = { team: p.team, teamLabel: "", genero: an.meta.genero, name: p.name, jogos: 0, golos: 0, acao: 0, sup: 0, pen: 0, excl: 0, penCom: 0, penFalh: 0, fora: 0 });
      q.jogos++; ["golos", "acao", "sup", "pen", "excl", "penCom", "penFalh"].forEach(x => q[x] += p[x]); if (p.faltas.length >= 3) q.fora++;
    });
    an.situations.forEach(s => all.situations.push({ ...s, game: an }));
    an.timeouts.forEach(s => all.timeouts.push({ ...s, game: an }));
  });
  Object.values(players).forEach(p => { const t = teams[p.team + "|" + p.genero]; p.teamLabel = t ? t.label : p.team; });
  Object.values(teams).forEach(t => {
    const ps = Object.values(players).filter(p => p.team === t.team && p.genero === t.genero && p.golos > 0).sort((a, b) => b.golos - a.golos);
    t.marcadores = ps.length; t.top1 = ps[0] ? ps[0].golos : 0; t.top1Nome = ps[0] ? ps[0].name : ""; t.top3 = ps.slice(0, 3).reduce((a, p) => a + p.golos, 0);
  });
  return { teams: Object.values(teams), players: Object.values(players), ...all, games: list };
}

/* ===== Pontos-chave e ações ===== */
function diagnose(t, ctx = {}) {
  const J = Math.max(1, t.jogos), f = [], m = [], a = [];

  if (t.inf >= 3 && pctN(dInf, t.inf) >= 70) add(f, 8, `Defesa em inferioridade sólida: ${dInf} de ${t.inf} defendidas (${pct(dInf, t.inf)}).`);
  if (t.penGanhos >= 2 && t.penFalh === 0 && t.pen === t.penGanhos) add(f, 6, `Penáltis: ${t.pen} em ${t.penGanhos} convertidos.`);
  if (t.excl / J <= 6) add(f, 5, `Disciplina: ${t.excl} exclusões${J > 1 ? ` (${dec1(t.excl / J)} por jogo)` : ""}.`);
  if (t.sofComSeg >= 5 && pctN(t.respostas, t.sofComSeg) >= 55) add(f, 5, `Boa reação a golo sofrido: ${pct(t.respostas, t.sofComSeg)}.`);
  if (t.marcadores / J >= 8 || t.marcadores >= 9) add(f, 4, `Ataque repartido: ${t.marcadores} marcadores diferentes.`);
  if (t.acao / J >= 12) add(f, 6, `Forte em jogo jogado: ${t.acao} golos${J > 1 ? ` (${dec1(t.acao / J)} por jogo)` : ""}.`);
  if (t.sprints / (4 * J) >= 0.75) add(f, 3, `Ganhou ${t.sprints} de ${4 * J} sprints.`);
  if (t.perWon / J >= 3) add(f, 6, `Ganhou ${t.perWon} de ${4 * J} períodos.`);
  if (t.ult4[0] - t.ult4[1] >= 2) add(f, 5, `Fecho forte: ${t.ult4[0]}–${t.ult4[1]} nos últimos 4 minutos${J > 1 ? " (somado)" : ""}.`);

  if (t.nSup >= 4 && pctN(t.supConv, t.nSup) < 25) { add(m, 10, `Superioridade: ${t.supConv}/${t.nSup} (${pct(t.supConv, t.nSup)}).`); add(a, 10, "Prioridade: 2–3 jogadas de 6x5 com finalização entre 6 e 10 s e segunda opção até aos 20 s."); }
  if (t.inf >= 3 && pctN(dInf, t.inf) < 55) { add(m, 9, `Inferioridade: ${t.infSof} golos sofridos em ${t.inf} (${pct(dInf, t.inf)} defendidas).`); add(a, 9, "Defesa em 5x6: posicionamento, bloqueio e pressão ao jogador livre."); }
  if (t.penFalh >= 2) { add(m, 8, `Penáltis: ${t.pen} em ${t.penGanhos} (${t.penFalh} falhados).`); add(a, 8, "Rotina de penáltis sob fadiga, com 2 marcadores definidos."); }
  if (t.penCom / J >= 3) { add(m, 7, `Cometeu ${t.penCom} faltas de penálti${J > 1 ? ` (${dec1(t.penCom / J)} por jogo)` : ""}.`); add(a, 7, "Defesa dentro dos 5 m: preferir a exclusão ao penálti."); }
  if (t.excl / J >= 10 || Math.max(...t.exclP) >= 4 * J) { add(m, 7, `${t.excl} exclusões${Math.max(...t.exclP) >= 4 ? `, ${Math.max(...t.exclP)} no ${t.exclP.indexOf(Math.max(...t.exclP)) + 1}.º período` : ""}.`); add(a, 6, "Gestão das faltas pessoais a partir do 3.º período."); }

function supTableRows(ts) { return ts.map(t => [t.label || t.team, t.nSup, t.supConv, pct(t.supConv, t.nSup), t.inf, t.infSof, pct(t.inf - t.infSof, t.inf), sgn(t.supConv - t.infSof)]); }
function stateBars(ts) {

      const c3 = (CW - 6) / 3; const colsD = [["PONTOS FORTES", b.f, [12, 138, 78]], ["A MELHORAR", b.m.length ? b.m : ["Sem pontos críticos nos indicadores da ata."], [194, 65, 12]], ["AÇÃO SUGERIDA", b.a, [31, 111, 209]]];

/* ---------- armazenamento ---------- */

function decodeGame(d) { return { id: d.id, meta: d.meta || {}, rosters: d.rosters || {}, coaches: d.coaches || {}, events: (d.events || []).map(s => { const [p, t, tm, n, c] = String(s).split("|"); return [+p, t, tm || null, n === "" ? null : +n, +c]; }), checks: (d.checks || []).map(s => { const [p, t, a, b] = String(s).split("|"); return { p: +p, t, sc: [+a, +b] }; }), warnings: d.warnings || [], fileName: d.fileName || "", savedAt: d.savedAt }; }
const LS = "atas-polo-v1";
function lsRead() { try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch (e) { return []; } }
function lsWrite(list) { try { localStorage.setItem(LS, JSON.stringify(list)); return true; } catch (e) { return false; } }

  let db = null; try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (db) {
    const col = db.collection("jogos"); let timer = setTimeout(() => showNote("Ainda não foi possível ler as atas guardadas. A ligação pode estar lenta; os dados aparecem assim que chegarem.", true), 10000);
    col.onSnapshot(snap => { if (!snap.metadata || !snap.metadata.fromCache) { clearTimeout(timer); hideNote(); } setGames(snap.docs.map(d => decodeGame({ id: d.id, ...d.data() }))); },
      err => { clearTimeout(timer); showNote(`Não foi possível ler as atas guardadas (${err && err.code || "erro"}). Recarregue a página mais tarde.`, true); });
    state.store = { mode: "db", save: async g => col.doc(g.id).set(encodeGame(g)), remove: async id => col.doc(id).delete() };
  } else {
    const local = lsRead().map(decodeGame);
    state.store = { mode: "local", save: async g => { const l = lsRead().filter(x => x.id !== g.id); l.push(encodeGame(g)); if (!lsWrite(l)) throw new Error("storage"); setGames(l.map(decodeGame)); }, remove: async id => { const l = lsRead().filter(x => x.id !== id); lsWrite(l); setGames(l.map(decodeGame)); } };

    if (!list.length && typeof SEED_GAMES !== "undefined" && !(() => { try { return localStorage.getItem(LS + "-seeded"); } catch (e) { return "1"; } })()) { lsWrite(SEED_GAMES); try { localStorage.setItem(LS + "-seeded", "1"); } catch (e) { } list = SEED_GAMES.map(decodeGame); }

  const list = state.games.filter(g => (!comp || g.meta.competicao === comp) && (!gen || g.meta.genero === gen) && (!de || dateKey(g.meta.data) >= de) && (!ate || dateKey(g.meta.data) <= ate)).map(g => state.analysed.get(g.id)).filter(Boolean)
    .sort((a, b) => dateKey(a.meta.data).localeCompare(dateKey(b.meta.data)));
  const txt = [comp || "todas as competições", gen ? gen.toLowerCase() : "", de ? `desde ${de.split("-").reverse().join("/")}` : "", ate ? `até ${ate.split("-").reverse().join("/")}` : ""].filter(Boolean).join(" · ");
  return { list, txt };
}
function renderAll() {
  // seletor de jogo
  const sel = $("#sel-jogo"); sel.innerHTML = state.games.map(g => { const a = state.analysed.get(g.id); return `<option value="${esc(g.id)}">${esc(`${g.meta.data} · ${g.meta.local} ${a ? a.score[0] : ""}–${a ? a.score[1] : ""} ${g.meta.visit} · ${g.meta.competicao}`)}</option>`; }).join(""); if (state.selected) sel.value = state.selected;
  const rj = $("#rep-jogo"); const an = state.selected && state.analysed.get(state.selected);
  if (state.loading) { const m = `<div class="empty"><h2>A carregar as atas…</h2><p>As atas guardadas aparecem dentro de momentos.</p></div>`; rj.innerHTML = m; $("#rep-global").innerHTML = m; renderAtas(); return; }
  if (an) { state.repJogo = gameReport(an); renderBlocks(rj, state.repJogo); } else { state.repJogo = null; rj.innerHTML = emptyHTML("Ainda não há atas", "Importe a primeira ata em PDF para gerar o relatório do jogo."); }
  const { list, txt } = currentGlobal(); const rg = $("#rep-global");
  if (list.length) { state.agg = aggregate(list); state.repGlobal = globalReport(state.agg, txt); renderBlocks(rg, state.repGlobal); }
  else { state.agg = null; state.repGlobal = null; rg.innerHTML = state.games.length ? emptyHTML("Nenhum jogo neste filtro", "Altere a competição, o género ou as datas.") : emptyHTML("Ainda não há atas", "A análise global acumula todas as atas importadas."); }
  renderAtas();
}
function refreshFilters() { const f = $("#f-comp"), v = f.value; const comps = [...new Set(state.games.map(g => g.meta.competicao).filter(Boolean))].sort(); f.innerHTML = `<option value="">Todas</option>` + comps.map(c => `<option>${esc(c)}</option>`).join(""); if (comps.includes(v)) f.value = v; }
function renderAtas() {
  const t = $("#atas-table"); $("#atas-sub").textContent = state.games.length ? `${state.games.length} ata${state.games.length === 1 ? "" : "s"} · ${state.store && state.store.mode === "db" ? "guardadas na base partilhada desta página" : "guardadas neste navegador"}.` : "Ainda não há atas guardadas.";
  t.innerHTML = state.games.length ? `<thead><tr><th>Data</th><th>Jogo</th><th>Competição</th><th>Género</th><th>Ata</th><th>Conferência</th><th></th></tr></thead><tbody>${state.games.map(g => { const a = state.analysed.get(g.id); const v = a ? a.validation : { checks: 0, mismatches: 0 };
    return `<tr><td>${esc(g.meta.data)}</td><td><a href="#jogo" data-open="${esc(g.id)}">${esc(`${g.meta.local} ${a ? a.score[0] : ""}–${a ? a.score[1] : ""} ${g.meta.visit}`)}</a></td><td>${esc(g.meta.competicao)}</td><td>${esc(g.meta.genero)}</td><td>${esc(g.meta.ata)}</td><td>${v.checks ? (v.mismatches ? `<span class="pill warn">${v.mismatches} diferenças</span>` : `<span class="pill ok">✓ ${v.checks}/${v.checks}</span>`) : "–"}</td><td><button class="btn danger" data-del="${esc(g.id)}">Apagar</button></td></tr>`; }).join("")}</tbody>` : "";
}
function go(v) { state.view = v; ["jogo", "global", "importar", "atas"].forEach(x => { $("#v-" + x).hidden = x !== v; $("#tab-" + x).setAttribute("aria-current", x === v ? "page" : "false"); }); if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v); requestAnimationFrame(() => { drawCharts($("#rep-jogo")); drawCharts($("#rep-global")); }); }
window.go = go;

/* ---------- importação ---------- */
async function readPdf(file) {
  const data = new Uint8Array(await file.arrayBuffer());
  const doc = await pdfjsLib.getDocument({ data, isEvalSupported: false }).promise; const pages = [];
  for (let i = 1; i <= doc.numPages; i++) { const tc = await (await doc.getPage(i)).getTextContent(); pages.push(tc.items.map(t => ({ s: t.str, x: t.transform[4], y: t.transform[5], w: t.width }))); }
  return parseAta(pages);
}
function niceComp(s) { if (!s || s !== s.toUpperCase()) return s || ""; return s.toLowerCase().replace(/(^|\s|\/)([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase()).replace(/\bA(\d)\b/g, "A$1").replace(/\b(De|Da|Do|Dos|Das|E)\b/g, w => w.toLowerCase()); }
async function handleFiles(files) {
  for (const f of files) {
    if (!/\.pdf$/i.test(f.name) && f.type !== "application/pdf") { state.pending.unshift({ err: `«${f.name}» não é um PDF.`, name: f.name }); continue; }
    try { const g = await readPdf(f); g.fileName = f.name; g.meta.competicao = niceComp(g.meta.competicao); if (/femin/i.test(f.name) && g.meta.genero !== "Feminino") { g.meta.generoAta = g.meta.genero; g.meta.genero = "Feminino"; } g.id = gameId(g); state.pending.unshift({ g, an: analyseGame(g) }); }
    catch (e) { console.error(e); state.pending.unshift({ err: e && e.message && !/^\w+Error/.test(e.message) ? e.message : "Não foi possível ler este PDF. Confirme que é uma ata de pólo aquático da FPN.", name: f.name }); }
    renderImports();
  }
}
function renderImports() {
  $("#imports").innerHTML = state.pending.map((p, i) => {
    if (p.err) return `<div class="icard err"><div class="head"><b>${esc(p.name)}</b><span class="pill warn">Não importado</span></div><div>${esc(p.err)}</div><div class="acts"><button class="btn" data-drop="${i}">Remover</button></div></div>`;
    const g = p.g, an = p.an, v = an.validation, dup = state.games.some(x => x.id === g.id);
    return `<div class="icard"><div class="head"><b>${esc(`${g.meta.local} ${an.score[0]}–${an.score[1]} ${g.meta.visit}`)}</b><span class="muted">${esc(p.g.fileName)}</span>
      <span class="pill info">${g.events.length} eventos · ${Object.values(g.rosters).reduce((a, r) => a + Object.keys(r).length, 0)} jogadores</span>
      ${v.checks ? (v.mismatches ? `<span class="pill warn">${v.mismatches} diferenças com o marcador da ata</span>` : `<span class="pill ok">✓ Marcador conferido ${v.checks}/${v.checks}</span>`) : `<span class="pill warn">Sem marcador na ata para conferir</span>`}
      ${dup ? `<span class="pill warn">Já existe – guardar substitui</span>` : ""}</div>
      <div class="grid"><div><label class="lab" for="ic-c-${i}">Competição</label><input type="text" id="ic-c-${i}" data-k="competicao" data-i="${i}" value="${esc(g.meta.competicao)}"></div>
      <div><label class="lab" for="ic-g-${i}">Género</label><select id="ic-g-${i}" data-k="genero" data-i="${i}">${["Masculino", "Feminino"].map(x => `<option${g.meta.genero === x ? " selected" : ""}>${x}</option>`).join("")}</select></div>
      <div><label class="lab" for="ic-d-${i}">Data</label><input type="text" id="ic-d-${i}" data-k="data" data-i="${i}" value="${esc(g.meta.data)}"></div>
      <div><label class="lab" for="ic-a-${i}">Ata n.º</label><input type="text" id="ic-a-${i}" data-k="ata" data-i="${i}" value="${esc(g.meta.ata)}"></div></div>
      ${g.meta.generoAta ? `<div class="muted">A ata indica «${esc(g.meta.generoAta)}», mas o nome do ficheiro indica femininos. Confirme o género.</div>` : ""}
      ${g.warnings.length ? `<ul>${g.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul>` : ""}
      <div class="acts"><button class="btn primary" data-save="${i}">${dup ? "Substituir a guardada" : "Guardar ata"}</button><button class="btn" data-drop="${i}">Descartar</button></div></div>`;
  }).join("") + (state.pending.filter(p => !p.err).length > 1 ? `<div><button class="btn primary" data-saveall="1">Guardar todas (${state.pending.filter(p => !p.err).length})</button></div>` : "");
}
async function savePending(idxs) {
  let ok = 0, last = null;
  for (const i of idxs.sort((a, b) => b - a)) { const p = state.pending[i]; if (!p || p.err) continue; p.g.id = gameId(p.g);
    try { await state.store.save(p.g); ok++; last = p.g.id; state.pending.splice(i, 1); } catch (e) { toast(e && e.code === "permission_denied" ? "Não tem permissão para guardar atas nesta página." : "Não foi possível guardar a ata. Tente de novo."); } }
  renderImports(); if (ok) { toast(`${ok} ata${ok === 1 ? "" : "s"} guardada${ok === 1 ? "" : "s"}.`); state.selected = last; if (state.store.mode !== "db") renderAll(); else setTimeout(() => { state.selected = last; renderAll(); }, 400); go("jogo"); }
}

/* ---------- exportação ---------- */
function saveDirect(filename, blob) { const u = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }
async function getDl() { if (state.dl !== undefined) return state.dl; try { state.dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { state.dl = null; } return state.dl; }
async function doExport(kind, btn) {
  const [scope, fmt] = kind.split("-"); const rep = scope === "jogo" ? state.repJogo : state.repGlobal;
  if (!rep) { toast("Não há dados para exportar."); return; }
  btn.disabled = true;
  try {
    let blob; if (fmt === "xlsx") blob = buildXlsx(scope, scope === "jogo" ? { an: state.analysed.get(state.selected), rep } : { ag: state.agg, rep }); else if (fmt === "docx") blob = await buildDocx(rep); else blob = buildPdf(rep);
    const filename = `${rep.file}.${fmt}`;
    if (window.__exportHook) { window.__exportHook(filename, blob); return; }
    const dl = await getDl(); if (!dl) { if (!window.claude) { saveDirect(filename, blob); toast(`${filename} transferido.`); return; } toast("A transferência de ficheiros não está disponível nesta vista. Abra a página no claude.ai."); return; }
    await dl.save({ filename, data: blob }); toast(`${filename} pronto.`);
  } catch (e) { console.error(e); if (e && e.code === "declined") toast("Transferência cancelada."); else if (e && e.code === "rate_limited") toast("Já há uma transferência a aguardar confirmação."); else toast("Não foi possível gerar o ficheiro."); }
  finally { btn.disabled = false; }
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.view) go(t.dataset.view);
  if (t.dataset.exp) doExport(t.dataset.exp, t);
  if (t.dataset.save != null) savePending([+t.dataset.save]);
  if (t.dataset.saveall) savePending(state.pending.map((p, i) => i));
  if (t.dataset.drop != null) { state.pending.splice(+t.dataset.drop, 1); renderImports(); }
  if (t.dataset.open) { e.preventDefault(); state.selected = t.dataset.open; renderAll(); go("jogo"); }
  if (t.dataset.backup) { const data = JSON.stringify({ app: "atas-polo", versao: 1, exportado: new Date().toISOString(), atas: state.games.map(encodeGame) }, null, 1); const fn = `Copia_atas_polo_${new Date().toISOString().slice(0, 10)}.json`; const blob = new Blob([data], { type: "application/json" });
    if (window.__exportHook) { window.__exportHook(fn, blob); return; } getDl().then(dl => dl ? dl.save({ filename: fn, data: blob }).then(() => toast("Cópia pronta.")).catch(() => { }) : (saveDirect(fn, blob), toast("Cópia transferida."))); }
  if (t.dataset.del) { if (!t.classList.contains("armed")) { t.classList.add("armed"); t.textContent = "Confirmar"; setTimeout(() => { t.classList.remove("armed"); t.textContent = "Apagar"; }, 4000); return; }
    state.store.remove(t.dataset.del).then(() => toast("Ata apagada.")).catch(() => toast("Não foi possível apagar a ata.")); }
});
document.addEventListener("input", e => { const el = e.target; if (el.dataset.k && el.dataset.i != null) { const p = state.pending[+el.dataset.i]; if (p && p.g) { p.g.meta[el.dataset.k] = el.value; if (el.dataset.k === "genero" || el.dataset.k === "data") { p.an = analyseGame(p.g); } } } });
$("#sel-jogo").addEventListener("change", e => { state.selected = e.target.value; const an = state.analysed.get(state.selected); state.repJogo = gameReport(an); renderBlocks($("#rep-jogo"), state.repJogo); });
["#f-comp", "#f-gen", "#f-de", "#f-ate"].forEach(s => $(s).addEventListener("change", () => renderAll()));
$("#file-in").addEventListener("change", e => { handleFiles([...e.target.files]); e.target.value = ""; });
$("#restore-in").addEventListener("change", async e => { const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { const j = JSON.parse(await f.text()); const list = (j.atas || []).map(d => decodeGame(d)).filter(g => g.events.length && g.meta && g.meta.local); if (!list.length) throw new Error("vazio");
    let n = 0; for (const g of list) { try { await state.store.save(g); n++; } catch (err) { } } toast(`${n} ata${n === 1 ? "" : "s"} importada${n === 1 ? "" : "s"} da cópia.`); if (state.store.mode !== "db") renderAll(); }
  catch (err) { toast("Este ficheiro não é uma cópia válida das atas."); } });
const drop = $("#drop"); ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => handleFiles([...e.dataTransfer.files]));
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { drawCharts($("#rep-jogo")); drawCharts($("#rep-global")); }, 150); });
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { drawCharts($("#rep-jogo")); drawCharts($("#rep-global")); }); } catch (e) { }
new MutationObserver(() => { drawCharts($("#rep-jogo")); drawCharts($("#rep-global")); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["jogo", "global", "importar", "atas"].includes(h)) go(h); });

/* ---------- arranque ---------- */
if (window.pdfjsLib) { try { pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER_SRC; } catch (e) { } }
go(["jogo", "global", "importar", "atas"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "jogo");
renderAll();
initStore();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { drawCharts($("#rep-jogo")); drawCharts($("#rep-global")); });

</script>
